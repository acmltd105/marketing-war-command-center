<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipeline Pantry — design preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 2rem; }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; }
    p { color: #94a3b8; font-size: 0.875rem; margin-bottom: 2rem; }
    .grid { display: grid; gap: 2rem; max-width: 1000px; }
    @media (min-width: 720px) { .grid { grid-template-columns: 1fr 1fr; } }
    figure { margin: 0; background: #1e293b; border-radius: 12px; padding: 1rem; border: 1px solid #334155; }
    figcaption { font-size: 0.75rem; color: #94a3b8; margin-top: 0.75rem; }
    img { width: 100%; height: auto; border-radius: 8px; display: block; background: #fff; }
    a { color: #60a5fa; }
  </style>
</head>
<body>
  <h1>Pipeline Pantry — UI preview (SVG)</h1>
  <p>Minimal 2026-style wireframes. Open each file directly, or run <code>npm run dev</code> and visit <a href="/design-preview/index.html">/design-preview/index.html</a>.</p>
  <div class="grid">
    <figure>
      <img src="./login.svg" alt="Login screen preview" width="960" height="640" />
      <figcaption>Login — Microsoft + mock session</figcaption>
    </figure>
    <figure>
      <img src="./shell.svg" alt="App shell sidebar and main" width="960" height="640" />
      <figcaption>Shell — sidebar + contacts table</figcaption>
    </figure>
    <figure>
      <img src="./onboarding.svg" alt="Onboarding step preview" width="960" height="640" />
      <figcaption>Onboarding — step 2, Azure selected</figcaption>
    </figure>
    <figure>
      <img src="./empty-state.svg" alt="Empty state preview" width="720" height="400" />
      <figcaption>Empty state — dashed region, one CTA</figcaption>
    </figure>
  </div>
</body>
</html>
